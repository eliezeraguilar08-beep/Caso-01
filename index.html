<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Estimador de pedidos</title><link rel="stylesheet" href="{{ url_for('static', filename='estilos.css') }}"></head><body><main class="container"><header class="hero"><span class="eyebrow">SENATI · MACHINE LEARNING</span><h1>Estimador de pedidos</h1><p>Estimación semanal de pedidos de kits de robótica.</p></header><section class="card"><h2>Datos de la semana</h2><form method="post"><label for="consultas_web">Consultas web (5–70)</label><input id="consultas_web" name="consultas_web" type="number" min="5" max="70" required value="{{ valores.consultas_web }}"><label for="inversion_publicidad_soles">Inversión publicitaria (S/ 0–1100)</label><input id="inversion_publicidad_soles" name="inversion_publicidad_soles" type="number" min="0" max="1100" step="0.01" required value="{{ valores.inversion_publicidad_soles }}"><label for="campana_escolar">¿Hay campaña escolar?</label><select id="campana_escolar" name="campana_escolar"><option value="0" {% if valores.campana_escolar == '0' %}selected{% endif %}>No (0)</option><option value="1" {% if valores.campana_escolar == '1' %}selected{% endif %}>Sí (1)</option></select><button type="submit">Calcular estimación</button></form>{% if error %}<div class="message error">{{ error }}</div>{% endif %}{% if resultado is not none %}<div class="message success"><span>Pedidos estimados</span><strong>{{ '%.2f'|format(resultado) }}</strong></div>{% endif %}</section><footer>Proyecto educativo</footer></main></body></html>
